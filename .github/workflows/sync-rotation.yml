name: Sync In Rotation playlist

# Runs once a day and whenever you trigger it manually from the Actions tab.
# Pulls the playlist via the Spotify Web API and commits the result to
# assets/data/rotation.json. If the refresh token has expired (Spotify
# expires them 6 months after the original authorization), this job fails
# with a clear message in its log — the site itself keeps showing the last
# successful sync, it does not go blank.

on:
  schedule:
    - cron: "17 13 * * *"   # ~6:17am Pacific / 1:17pm UTC, daily
  workflow_dispatch: {}      # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync playlist from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: node scripts/sync-rotation.mjs

      - name: Commit if the playlist changed
        run: |
          git config user.name "rotation-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/rotation.json
          git diff --cached --quiet && echo "No changes." || git commit -m "Sync In Rotation playlist"
          git push
